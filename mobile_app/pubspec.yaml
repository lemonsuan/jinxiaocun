name: inventory_mobile_app
description: Offline-first inventory receiving app.
publish_to: "none"
version: 1.0.10+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  http: ^1.2.1
  crypto: ^3.0.7
  share_plus: ^12.0.2
  camera: ^0.12.0+1
  image: ^4.2.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Host SQLite tests use the system library, without native-asset downloads.
  sqflite_common_ffi: 2.3.6
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
